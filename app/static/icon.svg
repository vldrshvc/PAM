<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PAM">
  <rect width="128" height="128" rx="28" fill="#1b3557"/>
  <!-- the page -->
  <rect x="24" y="26" width="80" height="80" rx="7" fill="#fffcf5"/>
  <!-- margin rule -->
  <rect x="37" y="26" width="2" height="80" fill="#e6b0aa"/>
  <!-- the ledger's takings, ruled as bars -->
  <g fill="#1b3557">
    <rect x="48" y="78" width="10" height="16" rx="2"/>
    <rect x="64" y="64" width="10" height="30" rx="2"/>
    <rect x="80" y="50" width="10" height="44" rx="2"/>
  </g>
  <!-- ruled lines under the heading -->
  <g stroke="#cfdce9" stroke-width="3" stroke-linecap="round">
    <path d="M48 40h42M48 50h20"/>
  </g>
  <!-- spiral binding punched through the top edge -->
  <g fill="#1b3557">
    <circle cx="39" cy="26" r="6"/><circle cx="59" cy="26" r="6"/>
    <circle cx="79" cy="26" r="6"/><circle cx="99" cy="26" r="6"/>
  </g>
  <g fill="#fffcf5" opacity=".9">
    <circle cx="39" cy="24" r="3"/><circle cx="59" cy="24" r="3"/>
    <circle cx="79" cy="24" r="3"/><circle cx="99" cy="24" r="3"/>
  </g>
</svg>
