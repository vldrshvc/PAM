<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5f">
  <title>PAM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">PAM</span>
    <nav id="tabs" class="tabs" hidden>
      <button data-view="today" class="active">Today</button>
      <button data-view="month">Month</button>
      <button data-view="categories">Categories</button>
    </nav>
    <button id="logout" class="link" hidden>Log out</button>
  </header>

  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>

  <template id="tpl-login">
    <section class="card narrow">
      <h1>Sign in</h1>
      <form id="login-form" class="stack">
        <input name="username" placeholder="Username" autocomplete="username" required minlength="3">
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required minlength="8">
        <div class="row">
          <button type="submit" class="primary">Log in</button>
          <button type="button" id="register-btn">Register</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-today">
    <section class="card summary" id="summary-card">
      <div class="big"><span class="label">Spent today</span><span id="spent-today">–</span></div>
      <div class="split">
        <div><span class="label">This month</span><span id="spent-month">–</span></div>
        <div><span class="label">Remaining</span><span id="remaining" class="remaining">–</span></div>
      </div>
    </section>

    <section class="card">
      <form id="add-form" class="stack">
        <div class="row">
          <input id="raw-text" placeholder='e.g. "SuperValu 12.40"' autocomplete="off">
          <button type="button" id="suggest-btn">Suggest</button>
        </div>
        <div class="row">
          <input id="price" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount" required>
          <select id="category" required></select>
        </div>
        <div class="row">
          <input id="date" type="date" required>
          <input id="description" placeholder="Description (optional)" maxlength="255">
        </div>
        <p id="suggest-note" class="note" hidden></p>
        <button type="submit" class="primary">Add expense</button>
      </form>
    </section>

    <section class="card">
      <h2>Today</h2>
      <ul id="today-list" class="list"></ul>
    </section>
  </template>

  <template id="tpl-month">
    <section class="card">
      <h2 id="month-title">This month</h2>
      <div class="split">
        <div><span class="label">Spent</span><span id="m-spent">–</span></div>
        <div><span class="label">Budget left</span><span id="m-remaining" class="remaining">–</span></div>
      </div>
      <ul id="month-list" class="list"></ul>
    </section>
  </template>

  <template id="tpl-categories">
    <section class="card">
      <form id="cat-form" class="row">
        <input id="cat-name" placeholder="New category" required maxlength="50">
        <input id="cat-limit" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Limit">
        <button type="submit" class="primary">Add</button>
      </form>
    </section>
    <section class="card">
      <ul id="cat-list" class="list"></ul>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
