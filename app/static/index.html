<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b3557" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14263d" media="(prefers-color-scheme: dark)">
  <title>PAM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand">PAM</span>
    <span id="screen-title" class="screen-title"></span>
  </header>

  <main id="view"></main>

  <nav id="tabs" class="tabs" aria-label="Sections" hidden>
    <button data-view="today" class="active">Today</button>
    <button data-view="month">Month</button>
    <button data-view="categories">Categories</button>
    <button data-view="accounts">Accounts</button>
  </nav>
  <div id="toast" class="toast" hidden></div>

  <template id="tpl-login">
    <section class="card narrow">
      <h1>Sign in</h1>
      <form id="login-form" class="stack">
        <input name="username" placeholder="Username" autocomplete="username" required minlength="3">
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required minlength="8">
        <div class="row">
          <button type="submit" class="primary">Log in</button>
          <button type="button" id="register-btn">Register</button>
        </div>
      </form>
    </section>
  </template>

  <template id="tpl-today">
    <section class="card summary" id="summary-card">
      <div class="big"><span class="label">Balance</span><span id="balance">–</span></div>
      <div class="split">
        <div><span class="label">Spent today</span><span id="spent-today">–</span></div>
        <div><span class="label">Earned today</span><span id="earned-today" class="plus">–</span></div>
        <div><span class="label">Spent this month</span><span id="spent-month">–</span></div>
        <div><span class="label">Budget left</span><span id="remaining" class="remaining">–</span></div>
      </div>
      <div id="account-chips" class="chips"></div>
    </section>

    <section class="card">
      <h2>History</h2>
      <ul id="feed" class="list"></ul>
      <button type="button" id="load-more" class="more">Earlier</button>
    </section>

    <section class="card">
      <h2>Targets</h2>
      <ul id="target-list" class="list"></ul>
      <form id="target-form" class="stack">
        <div class="row">
          <input id="target-name" placeholder="Goal" required maxlength="50">
          <input id="target-amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount" required>
        </div>
        <div class="row">
          <input id="target-date" type="date" required>
          <button type="submit">Set target</button>
        </div>
      </form>
    </section>

    <button type="button" id="fab" class="fab" aria-label="Add an entry" aria-haspopup="dialog"></button>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close></div>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="New entry">
        <div class="sheet-grip" aria-hidden="true"></div>
        <button type="button" class="sheet-close" data-close aria-label="Close"></button>
        <div class="segmented" id="kind">
          <button type="button" data-kind="expense" class="active">Expense</button>
          <button type="button" data-kind="income">Income</button>
          <button type="button" data-kind="transfer">Transfer</button>
        </div>
        <form id="add-form" class="stack">
          <div class="row">
            <input id="raw-text" placeholder='e.g. "SuperValu 12.40"' autocomplete="off">
            <button type="button" id="suggest-btn">Suggest</button>
          </div>
          <div class="row">
            <input id="price" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount" required>
            <select id="category" class="grow" required></select>
          </div>
          <div class="row">
            <input id="date" type="date" required>
            <select id="account" required></select>
          </div>
          <input id="description" placeholder="Description (optional)" maxlength="255">
          <p id="suggest-note" class="note" hidden></p>
          <button type="submit" class="primary">Add expense</button>
        </form>
        <form id="income-form" class="stack" hidden>
          <div class="row">
            <input id="income-amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount" required>
            <select id="income-source" required>
              <option value="work">Work</option>
              <option value="friend">Friend</option>
              <option value="debt">Debt</option>
              <option value="bonus">Bonus</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="row">
            <input id="income-date" type="date" required>
            <select id="income-account" required></select>
          </div>
          <input id="income-description" placeholder="Description (optional)" maxlength="255">
          <button type="submit" class="primary">Add income</button>
        </form>
        <form id="transfer-form" class="stack" hidden>
          <div class="row">
            <select id="transfer-from" required></select>
            <span class="arrow">→</span>
            <select id="transfer-to" required></select>
          </div>
          <div class="row">
            <input id="transfer-amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount" required>
            <input id="transfer-date" type="date" required>
          </div>
          <input id="transfer-description" placeholder="Description (optional)" maxlength="255">
          <button type="submit" class="primary">Move money</button>
        </form>
      </div>
    </div>
  </template>

  <template id="tpl-month">
    <section class="card">
      <h2 id="month-title">This month</h2>
      <div class="split">
        <div><span class="label">Spent</span><span id="m-spent">–</span></div>
        <div><span class="label">Earned</span><span id="m-earned" class="plus">–</span></div>
        <div><span class="label">Budget left</span><span id="m-remaining" class="remaining">–</span></div>
        <div><span class="label">Net this month</span><span id="m-net">–</span></div>
      </div>
      <ul id="month-list" class="list"></ul>
    </section>
  </template>

  <template id="tpl-categories">
    <section class="card">
      <form id="cat-form" class="row">
        <input id="cat-name" placeholder="New category" required maxlength="50">
        <input id="cat-limit" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Limit">
        <button type="submit" class="primary">Add</button>
      </form>
    </section>
    <section class="card">
      <ul id="cat-list" class="list"></ul>
    </section>
  </template>

  <template id="tpl-accounts">
    <section class="card">
      <form id="acc-form" class="stack">
        <input type="hidden" id="acc-id">
        <div class="row">
          <input id="acc-name" placeholder="Account name" required maxlength="50">
          <select id="acc-type" required>
            <option value="debit">Debit card</option>
            <option value="cash">Cash</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="row">
          <input id="acc-subtype" placeholder="Bank (e.g. AIB)" maxlength="50">
          <input id="acc-opening" type="number" inputmode="decimal" step="0.01" placeholder="Opening €">
        </div>
        <div class="row">
          <button type="submit" class="primary" id="acc-submit">Add account</button>
          <button type="button" id="acc-cancel" hidden>Cancel</button>
        </div>
      </form>
    </section>
    <section class="card">
      <ul id="acc-list" class="list"></ul>
      <p class="note">Tap an account to edit it. Opening balance is what it held before your first entry here.</p>
    </section>
    <section class="card">
      <button id="logout" class="danger">Log out</button>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
